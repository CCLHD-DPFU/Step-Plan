<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEP Calculator</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#161a21;--mut:#5d6675;--line:#dde1e7;--acc:#2f5bd8;--accink:#fff;--g:#1f9d55;--a:#d89a00;--r:#d33a2c;--k:#15171b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1a1e26;--ink:#eef0f4;--mut:#9aa4b4;--line:#2d333e;--acc:#6f93ff;--accink:#0b1020;--k:#3b414c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101319;--card:#1a1e26;--ink:#eef0f4;--mut:#9aa4b4;--line:#2d333e;--acc:#6f93ff;--accink:#0b1020;--k:#3b414c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 12px 8px}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:8px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:9px;border-radius:8px}
.seg button.on{background:var(--acc);color:var(--accink)}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.ctl{display:flex;gap:8px;align-items:center}
select{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 8px}
.pt{min-width:34px;text-align:center;font-weight:700;border-radius:8px;padding:6px 0;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;min-height:56px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
summary{font-weight:600;cursor:pointer}details h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:12px 0 4px}
details p{margin:0;white-space:pre-line;font-size:14px}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px;margin:0 -12px}
.res{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.score{font-size:26px;font-weight:800;min-width:64px}.score small{font-size:12px;color:var(--mut);font-weight:500}
.badge{flex:1;border-radius:10px;padding:8px 10px;font-weight:700;color:#fff;background:var(--line);color:var(--mut)}
.badge span{display:block;font-weight:500;font-size:12px}
.badge.l0{background:var(--g);color:#fff}.badge.l1{background:var(--a);color:#111}.badge.l2{background:var(--r);color:#fff}.badge.l3{background:var(--k);color:#fff}
.btns{display:flex;gap:8px}
.btn{flex:1;text-align:center;text-decoration:none;font:inherit;font-weight:700;border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.p{background:var(--acc);color:var(--accink);border-color:var(--acc);flex:2}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.rst{background:none;border:0;color:var(--acc);font:inherit;padding:4px 0;margin:0 0 6px}
</style></head><body><main>
<h1>Hospital Demand &amp; Capacity</h1>
<p class="sub">STEP escalation calculator &ndash; choose a level for each trigger</p>
<div class="seg" id="fac"></div><div class="seg" id="type"></div>
<div id="rows"></div>
<button class="rst" id="rst" type="button">Reset this calculator</button>
<textarea id="note" placeholder="Optional note to add to the update"></textarea>
<details id="plan"><summary>Recommended actions</summary><div id="pb"><p>Complete all triggers to see the actions for this level.</p></div></details>
<div class="bar">
<div class="res"><div class="score" id="score">&ndash;</div><div class="badge" id="badge">Select all triggers</div></div>
<div class="btns"><a class="btn p" id="send" role="button" target="_blank" rel="noopener" aria-disabled="true">Send update to Teams</a><button class="btn" id="copy" type="button">Copy</button></div>
</div></main><div id="toast"></div>
<script>

versions, or Out of Hospital options early. Ensure Ambulance SAFE model utilised. Push appropriate short stay candidates into ED SSU (“Push/Surge”). Explore hot swaps for Rapid Transfer Service (RTS).", "resp": "NUM / Patient Flow/ ED/Unit Leads / After Hours NM / AH DPFU NM / Executive Duty Manager/ GM support", "time": "Review hourly"}, {"strat": "Expand surge beds as per Capacity Action Plan; cohort MROs; review/deferral of elective activity; inter-facility transfers; use discharge lounge/transit pathways • Intensive AH presence for mobility, discharge facilitation. Imaging to prioritise discharge critical scans, extend hours if required. Create early transfer lists for G2G / tomorrow G2G for early transfers.\nTargeted HoD Communication via DMS Engage Clinical Rounding for all long stay patients. Liaise with neighbouring facilities for inter facility transfers. Escalate to DM/EOC for multi service decisions and extended support. Use MAU, SSU, Transit Lounge aggressively to free acute beds. Full SAFE model escalation. Preferential push into SSU for all eligible cohorts.", "resp": "Nurse Managers / Service Managers; GM; EDO notified", "time": "Review every 30–60 minutes"}, {"strat": "Implement hospital wide Capacity Action Plan (CAP). Activate district wide coordination and load balancing through escalation to EDO/CE. Review/Suspend non-essential clinical activities (elective, non-urgent imaging, some outpatient work).\nALL HoD communication via DMS\nExecutive rounding coordinated by DMS with participation by Clinical Directors, DON, DMS, and HiTH Deploy “all hands” workforce mobilisation. Critical AH and Imaging support activated for immediate discharge needs. Ambulance/PTS; Private hospital and bordering LHD engagement. continuous review until safe de-escalation.", "resp": "Facility Executive Lead, EDO, CE, Service Managers/ Directors. Leadership Teams", "time": "Continuous"}]}, "ED": {"rows": [{"label": "Ambulance", "opts": ["Nil offload delays", "1 ambulance>30 min", "2 ambulances >30 min", "3 ambulances >30 min"]}, {"label": "Total Patients in ED", "opts": ["<40", ">40-59", "60-79", ">80"]}, {"label": "Total To Be Seen", "opts": ["<15 To Be Seen", "15-24 To Be Seen", "25-40 To Be Seen", ">40 To Be Seen"]}, {"label": "Resus Capacity", "opts": ["3 resus beds available", "2 resus beds available", "1 resus bed available", "Nil resus capacity"]}, {"label": "Admissions", "opts": ["<5 admissions", "5-15 admissions", "15-25 admissions", ">25 admissions"]}, {"label": "IHT Transfers", "opts": ["Nil IHT", "<4 IHT", "4-7 IHT", ">8 IHT"]}, {"label": "ICU Delays", "opts": ["ICU <1hour", "ICU 1-2hours", "ICU 2-3hours", "ICU >3hours"]}, {"label": "MH Delays", "opts": ["MH<1hour", "MH 1-2hours", "MH 2-4hours", "MH >4hours"]}, {"label": "Diagnostic Delays", "opts": ["Nil", "<60 mins", "60-90 mins", ">90 mins"]}, {"label": "Workforce Shortage - Nursing & Medical", "opts": ["Minus 1 per shift", "Minus 2 per shift", "Minus 3 per shift", ">Minus 3 per shift"]}], "cuts": [11, 14, 17], "plan": [{"strat": "Execute routine capacity & \ndemand strategies", "resp": "ED SS, ED NUM, Navigator", "time": "Ongoing"}, {"strat": "Continue routine strategies.\nED SS to escalate specialty team reviews \nEngage District Patient Flow to expedite all external / IHT transfers.                                      \nED NUM to work with PF team for clear \nstrategies,  time frames and prioritise patient movements with Environmental services. \nNavigator to ensure all MoCs i.e SSU, MAU, \nPAU and HITH services are utilised \nand work with Discharge planners and transit lounge.               \nED NUM to review FOH, Waiting room patients hourly and work with Triage to identify and prioritise patients for Acute spaces. \nED NUM & ED SS to reallocate internal \nresources to areas of demand.               \nNavigator to identify, evaluate and escalate any processing delays.", "resp": "ED SS, ED NUM, Navigator", "time": "Review strategies every hour and \nescalate accordingly"}, {"strat": "Continue with level 1 strategies. \nConsultant to consultant discussion to expedite review of know patients from the department\nEscalate any barriers to the Wyong leadership team (BAU).                                                      \nReview nursing and medical shortfalls, any barriers to allied health, imaging or discharge planners, escalate to leadership team.\nTriage to inform patients regarding potential lengthy delays and promote \nalternative services. \nConsider ANSW Hotswaps and alternative transport options for transfers out.\nRequest IPU Teams come and review their \nno bedded patients in ED.   Discuss/request NSW Ambulance Matrix divert/reduction.\nEnsure SSU filled to capacity - with either SSU suitable or Wyong NB with Plan patients. \nEngage WPU for assistance in Paeds Pod - nursing & medical + have discussion \naround sending (A) Paed patients to wait in WPU department", "resp": "ED SS, ED NUM, Navigator", "time": "Review strategies every 30 minutes \nand escalate accordingly"}, {"strat": "Continue with level 1& 2 strategies. \n\nDeployment of staff on non-clinical days / \neducation days and indirect roles  (where appropriate) to assist in ED - both nursing and medical\n\nContact ED Staff Specialist on call\n\nContact Wyong Leadership team in hours or \nAHNM after hours to lead black level safety huddle.", "resp": "ED SS, ED NM, ED NUM, Navigator", "time": "Review strategies every 30 minutes \nand escalate accordingly"}]}}, "Wyong": {"Site": {"rows": [{"label": "ED STEP Level", "opts": ["0 - Green", "1 - Amber", "2 - Red", "3 - Black"]}, {"label": "Surge bed Utilisation/Bed Net Capacity (Physical ED-accessible beds)", "opts": ["Zero", "<12 Surge Beds (3C 5B 3H 3G)", "13 - 36 Surge Beds (SSU 3F)", ">36 Surge Beds"]}, {"label": "LOS > 9 days (# ED Accessible beds 228)", "opts": ["<90 patients", "90-100 patients", "100-110 patients", ">110 patients"]}, {"label": "Workforce", "opts": ["Baseline staffing - no impact", "Minor gaps mitigated - no flow impact", "Multi-discipline gaps affecting throughout", "Critical shortfalls across site in all disciplines"]}], "cuts": [7, 10, 13], "plan": [{"strat": "Maintain discharge planning and ensure EDD documented on all inpatients daily. \nComplete board rounds / nursing huddles on all inpatient units. \nConfirm discharge pipeline, including EDD <24–48 hours.\nPF Manager and AHNM review real time incoming vs outgoing variance, predicted admissions vs discharges. \nTrack ED admissions expected, SSU utilisation, ICU bed situation, and ambulance flow.\nBed allocation using Patient Flow Portal & FirstNet. \nEnsure early utilisation of Transit Lounge for all patients from ED accessbile wards.\nEarly referral to Discharge Concierge.\nMonitor Waiting for What (W4W), ePJB utilisation, and escalating if delays emerge. \nRadiology / Pathology ensure routine turnaround meets agreed timeframe", "resp": "NUM / Patient Flow/ ED/Unit Leads / After Hours NM / AH DPFU NM / Executive Duty Manager", "time": "BAU"}, {"strat": "Prioritise discharges (EDD verification); Validate incoming/outgoing variance & assess need for surge.\nactivate surge as per Capacity Action Plan, expedite discharge-critical diagnostics; align PTS priorities; Escalate W4W delays, radiology, pathology, pharmacy delays. Maximise ED SSU utilisation for <24 hour care pathways. \nRedirect suitable cases to MAU where clinically appropriate. \nConsider HiTH, VCAT, private facility diversions, or Out of Hospital options early. Ensure Ambulance SAFE model utilised. \nPush appropriate short stay candidates into ED SSU (“Push/Surge”). \nExplore hot swaps for Rapid Transfer Service (RTS).", "resp": "NUM / Patient Flow/ ED/Unit Leads / After Hours NM / AH DPFU NM / Executive Duty Manager/ GM support", "time": "Review hourly"}, {"strat": "Expand surge beds as per Capacity Action Plan; cohort MROs; review/deferral of elective activity; inter-facility transfers; use discharge lounge/transit pathways • Intensive AH presence for mobility, discharge facilitation. \nImaging to prioritise discharge critical scans, extend hours if required. \nCreate early transfer lists for G2G / tomorrow G2G for early transfers. \nEngage Clinical Rounding for all long stay patients.  \nLiaise with neighbouring facilities for inter facility transfers. \nEscalate to DM/EOC for multi service decisions and extended support. \nUse MAU, SSU, Transit Lounge aggressively to free acute beds.\nFull SAFE model escalation. \nPreferential push into SSU for all eligible cohorts.", "resp": "Nurse Managers / Service Managers; GM; EDO notified", "time": "Review every 30–60 minutes"}, {"strat": "Implement hospital wide Capacity Action Plan (CAP). \nActivate district wide coordination and load balancing through escalation to EDO/CE. \nReview/Suspend non essential clinical activities (elective, non urgent imaging, some outpatient work).\nDeploy “all hands” workforce mobilisation. \nCritical AH and Imaging support activated for immediate discharge needs.\nAmbulance/PTS; Private hospital and bordering LHD engagement. continuous review until safe de-escalation.", "resp": "Facility Executive Lead,\nEDO, CE, Service Managers/ Directors. Leadership Teams", "time": "Continuous"}]}, "ED": {"rows": [{"label": "Ambulance", "opts": ["Nil offload delays", "1 ambulance>30 min", "2 ambulances >30 min", "3 ambulances >30 min"]}, {"label": "Total Patients in ED", "opts": ["<40", ">40-59", "60-79", ">80"]}, {"label": "Total To Be Seen", "opts": ["<15 To Be Seen", "15-24 To Be Seen", "25-40 To Be Seen", ">40 To Be Seen"]}, {"label": "Resus Capacity", "opts": ["3 resus beds available", "2 resus beds available", "1 resus bed available", "Nil resus capacity"]}, {"label": "Admissions", "opts": ["<5 admissions", "5-15 admissions", "15-25 admissions", ">25 admissions"]}, {"label": "IHT Transfers", "opts": ["Nil IHT", "<4 IHT", "4-7 IHT", ">8 IHT"]}, {"label": "ICU Delays", "opts": ["ICU <1hour", "ICU 1-2hours", "ICU 2-3hours", "ICU >3hours"]}, {"label": "MH Delays", "opts": ["MH<1hour", "MH 1-2hours", "MH 2-4hours", "MH >4hours"]}, {"label": "Diagnostic Delays", "opts": ["Nil", "<60 mins", "60-90 mins", ">90 mins"]}, {"label": "Workforce Shortage - Nursing & Medical", "opts": ["Minus 1 per shift", "Minus 2 per shift", "Minus 3 per shift", ">Minus 3 per shift"]}], "cuts": [11, 14, 17], "plan": [{"strat": "Execute routine capacity & \ndemand strategies", "resp": "ED SS, ED NUM, Navigator", "time": "Ongoing"}, {"strat": "Continue routine strategies.\nED SS to escalate specialty team reviews \nEngage District Patient Flow to expedite all external / IHT transfers.                                      \nED NUM to work with PF team for clear \nstrategies,  time frames and prioritise patient movements with Environmental services. \nNavigator to ensure all MoCs i.e SSU, MAU, \nPAU and HITH services are utilised \nand work with Discharge planners and transit lounge.               \nED NUM to review FOH, Waiting room patients hourly and work with Triage to identify and prioritise patients for Acute spaces. \nED NUM & ED SS to reallocate internal \nresources to areas of demand.               \nNavigator to identify, evaluate and escalate any processing delays.", "resp": "ED SS, ED NUM, Navigator", "time": "Review strategies every hour and \nescalate accordingly"}, {"strat": "Continue with level 1 strategies. \nConsultant to consultant discussion to expedite review of know patients from the department\nEscalate any barriers to the Wyong leadership team (BAU).                                                      \nReview nursing and medical shortfalls, any barriers to allied health, imaging or discharge planners, escalate to leadership team.\nTriage to inform patients regarding potential lengthy delays and promote \nalternative services. \nConsider ANSW Hotswaps and alternative transport options for transfers out.\nRequest IPU Teams come and review their \nno bedded patients in ED.   Discuss/request NSW Ambulance Matrix divert/reduction.\nEnsure SSU filled to capacity - with either SSU suitable or Wyong NB with Plan patients. \nEngage WPU for assistance in Paeds Pod - nursing & medical + have discussion \naround sending (A) Paed patients to wait in WPU department", "resp": "ED SS, ED NUM, Navigator", "time": "Review strategies every 30 minutes \nand escalate accordingly"}, {"strat": "Continue with level 1& 2 strategies. \n\nDeployment of staff on non-clinical days / \neducation days and indirect roles  (where appropriate) to assist in ED - both nursing and medical\n\nContact ED Staff Specialist on call\n\nContact Wyong Leadership team in hours or \nAHNM after hours to lead black level safety huddle.", "resp": "ED SS, ED NM, ED NUM, Navigator", "time": "Review strategies every 30 minutes \nand escalate accordingly"}]}}};
const LV=[["Level 0","Business as usual","Green"],["Level 1","Moderate compromise","Amber"],["Level 2","Severe compromise","Red"],["Level 3","Extreme compromise","Black"]];
const S={fac:"Gosford",type:"Site",pick:{}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur=()=>D[S.fac][S.type];
const key=()=>S.fac+S.type;
const picks=()=>S.pick[key()]||(S.pick[key()]=cur().rows.map(()=>-1));
function seg(id,vals,k){$(id).innerHTML=vals.map(v=>`<button type="button" class="${S[k]===v?"on":""}" data-k="${k}" data-v="${v}">${v==="Site"?"Site STEP":v==="ED"?"ED STEP":v}</button>`).join("")}
function build(){
  seg("#fac",["Gosford","Wyong"],"fac");seg("#type",["Site","ED"],"type");
  const c=cur(),p=picks();
  $("#rows").innerHTML=c.rows.map((r,i)=>`<div class="row"><label for="s${i}">${esc(r.label)}</label><div class="ctl"><select id="s${i}" data-i="${i}"><option value="-1">Select&hellip;</option>${r.opts.map((o,j)=>`<option value="${j}"${p[i]===j?" selected":""}>${esc(o)}</option>`).join("")}</select><span class="pt" id="p${i}">&ndash;</span></div></div>`).join("");
  update();
}
function calc(){const p=picks(),c=cur(),done=p.every(x=>x>=0),score=p.reduce((a,x)=>a+(x>=0?x+1:0),0);let lv=-1;
  if(done){lv=c.cuts.findIndex(x=>score<=x);if(lv<0)lv=3}return{p,c,done,score,lv,max:c.rows.length*4}}
function update(){
  const r=calc();
  r.p.forEach((x,i)=>{$("#p"+i).textContent=x>=0?x+1:"\u2013"});
  $("#score").innerHTML=r.done?`${r.score}<small> / ${r.max}</small>`:"&ndash;";
  const b=$("#badge");
  if(r.done){const L=LV[r.lv];b.className="badge l"+r.lv;b.innerHTML=`${L[0]} &ndash; ${L[2]}<span>${L[1]}</span>`}
  else{b.className="badge";b.textContent="Select "+r.p.filter(x=>x<0).length+" more trigger"+(r.p.filter(x=>x<0).length>1?"s":"")}
  const a=$("#send");a.setAttribute("aria-disabled",r.done?"false":"true");$("#copy").disabled=!r.done;$("#copy").style.opacity=r.done?1:.45;
  $("#pb").innerHTML=r.done?[["Key strategies","strat"],["Responsibility","resp"],["Timeframe","time"]].map(([h,k])=>r.c.plan[r.lv][k]?`<h3>${h}</h3><p>${esc(r.c.plan[r.lv][k]).trim()}</p>`:"").join(""):"<p>Complete all triggers to see the actions for this level.</p>";
}
function message(){
  const r=calc(),L=LV[r.lv],n=$("#note").value.trim();
  const d=new Date().toLocaleString("en-AU",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  return `\u{1F6A6} ${S.fac} ${S.type==="ED"?"ED":"Site"} STEP update \u2013 ${d}\nScore ${r.score}/${r.max} \u2192 ${L[0].toUpperCase()} (${L[2]}) \u2013 ${L[1]}\n`+
    r.c.rows.map((x,i)=>`\u2022 ${x.label.replace(/\s*\(.*\)\s*$/,"")}: ${x.opts[r.p[i]]} (${r.p[i]+1})`).join("\n")+(n?`\nNote: ${n}`:"");
}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok}catch(e2){return false}}}
function toast(t){const e=$("#toast");e.textContent=t;e.className="on";setTimeout(()=>e.className="",3200)}
document.addEventListener("click",e=>{
  const b=e.target.closest(".seg button");if(b){S[b.dataset.k]=b.dataset.v;build();return}
  if(e.target.closest("#send")){if(!calc().done){e.preventDefault();return}
    const m=message();e.target.closest("#send").href="https://teams.microsoft.com/l/chat/0/0?message="+encodeURIComponent(m);
    copyText(m);toast("Copied \u2013 paste into your chat if it doesn\u2019t prefill");return}
  if(e.target.closest("#copy")&&calc().done){copyText(message()).then(ok=>toast(ok?"Copied to clipboard":"Couldn\u2019t copy \u2013 select the text manually"))}
  if(e.target.closest("#rst")){S.pick[key()]=cur().rows.map(()=>-1);build()}
});
document.addEventListener("change",e=>{if(e.target.matches("select")){picks()[+e.target.dataset.i]=+e.target.value;update()}});
build();
</script></body></html>
